name: Solo45 Core
version: "0.0.11"
tagline: A fast solo mining pool engine in Rust (test version)
icon: https://raw.githubusercontent.com/race45race/solo45-core/main/docs/icon.svg
description: >-
  ⚙️ Setup: open Solo45 Core after installing and enter your payout address. Then point a miner at your Umbrel's IP address on port 3346, for example stratum+tcp://192.168.1.50:3346. Keep a backup pool set on every miner. Keep port 3346 on your home network: don't forward it to the internet.


  Solo45 Core is the Solo45 pool rewritten in Rust: it builds work from your own Bitcoin node and pays any block you find straight to your address, with no pool fee. It runs next to the Solo45 app on its own port, so you can move miners over one at a time.


  • Same work as Solo45, byte for byte, with new blocks by ZMQ and an empty job to your miners within milliseconds.

  • Every job checked by your node (getblocktemplate proposal mode); a found block is saved first, then sent, and resent if the node is down or starting.

  • Template policy: leave out inscriptions, Runes, large OP_RETURN data, bare multisig or low fee rates; each rule Off, Watch (only count) or Filter.

  • Stall guard: if a peer holds up a new block, Core disconnects it after 60 seconds (adjustable), so your miners don't spend 10 minutes on an old block.

  • Stratum V2 (encrypted) on port 34255, next to Stratum V1 on 3346.

  • A status page: hashrate, miners, shares, best shares, block switch time, the node's block check, settings and backup/restore.


  This is a test version.
releaseNotes: >-
  Stratum V2 miners now drop work at once when the node refuses a job or your payout address changes (they used to keep the old payout until they reconnected). After a reboot, Core waits quietly for your node instead of logging errors. Your settings and miners carry over.

