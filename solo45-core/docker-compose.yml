version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solo45-core_dashboard_1
      APP_PORT: 8099

  pool:
    image: ghcr.io/race45race/solo45-core:v0.0.32@sha256:e449112843f5216bad6d2600011064b9689534fe8eff7eeead6039dd7544028e
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s  # the pool finishes sending a found block to the node before it stops
    command: ["serve"]
    ports:
      - "3346:3346"  # stratum for miners (keep it on your home network: don't forward it to the internet)
      - "34255:34255"  # Stratum V2 (encrypted) for SV2 miners and the Translator Proxy
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro  # read-only: only for the node's IPC socket (its IPC Mining Interface)
    environment:
      SOLO45_DATA_DIR: /data
      SOLO45_IPC_SOCKET: /bitcoin/${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH}  # templates over IPC when it's on; RPC otherwise
      SOLO45_LOG_FILE: /data/pool.log
      SOLO45_STRATUM_PORT: "3346"
      SOLO45_API_PORT: "3386"
      SOLO45_WEB_PORT: "8346"  # the status page, only through the Umbrel login
      SOLO45_SV2_PORT: "34255"  # Stratum V2; its authority key is made on first start (data/sv2-authority.json)
      SOLO45_API_TOKEN: ${APP_SOLO45_CORE_API_TOKEN}
      BITCOIN_ZMQ_HASHBLOCK: tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}  # new blocks the moment the node has them
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_CORE_IP}

  dashboard:  # the full Solo45 dashboard (same program as the Solo45 app's), named Solo45 SV2, reading only this pool
    image: ghcr.io/race45race/solo45:v0.1.78@sha256:1a446426559eea5fc64cb4a9e2a606dedcef7213fbafcce3d562242a8d8c3768
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - pool
    command: ["sh", "-c", "mkdir -p /data/pool/dash && exec python /app/server.py >> /data/pool/dash/dashboard.log 2>&1"]
    volumes:
      - ${APP_DATA_DIR}/data:/data/pool  # the pool's data: its log (read) and the dashboard's own folder dash/
    environment:
      SOLO45_APP_NAME: "Solo45 SV2"
      SOLO45_DASH_DATA: /data/pool/dash
      SOLO45_POOL_LOG: /data/pool/pool.log
      SOLO45_API_BASE: http://solo45-core_pool_1:3386
      SOLO45_API_TOKEN: ${APP_SOLO45_CORE_API_TOKEN}
      SOLO45_STRATUM_PORT: "3346"  # Stratum V1 miners on this pool
      SOLO45_OWN_PORTS: "34255"  # its Stratum V2 port counts as this pool too
      SOLO45_PROXY_HOST: solo45-core_app_proxy_1  # changes and live data only through the Umbrel login
      BITCOIN_ZMQ_HASHBLOCK: tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_CORE_DASHBOARD_IP}
