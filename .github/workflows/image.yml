name: Build image

# Builds ghcr.io/<owner>/solo45 for x86 and ARM whenever a version tag (v0.1.0, ...) is pushed,
# then runs the node-free checks (src/offline_test.py) inside the new image on real x86 and ARM machines.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/solo45
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test:
    needs: build
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # x86 and a real ARM (arm64) machine, like a Raspberry Pi
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Node-free checks inside the published image
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/solo45:${{ github.ref_name }} python /app/offline_test.py
