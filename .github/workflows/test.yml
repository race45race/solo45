name: Tests

# On every push to main and every pull request: build the image (not published) and run the node-free checks
# (src/offline_test.py) inside it, on x86 and on a real ARM machine. Releases are built and published by image.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # x86 and a real ARM (arm64) machine, like a Raspberry Pi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t solo45-test .
      - name: Node-free checks inside the image
        run: docker run --rm solo45-test python /app/offline_test.py
