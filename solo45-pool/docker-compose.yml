version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solo45-pool_dashboard_1
      APP_PORT: 8099

  pool:
    image: ghcr.io/race45race/solo45:v0.1.19@sha256:bf184c4d2c7e1265bff2acced013eeb01e75fc7e46730d5ad715a699e7d2ca43
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s  # the pool finishes sending a found block to the node before it stops
    command: ["python", "/app/pool.py"]
    ports:
      - "3333:3333"  # stratum for miners (keep it on your home network: don't forward it to the internet)
    volumes:
      - ${APP_DATA_DIR}/data/pool:/data/pool
    environment:
      SOLO45_DATA_DIR: /data/pool
      SOLO45_API_TOKEN: ${APP_SOLO45_POOL_API_TOKEN}
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_POOL_IP}

  dashboard:
    image: ghcr.io/race45race/solo45:v0.1.19@sha256:bf184c4d2c7e1265bff2acced013eeb01e75fc7e46730d5ad715a699e7d2ca43
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - pool
    command: ["sh", "-c", "exec python /app/server.py >> /data/dash/dashboard.log 2>&1"]
    volumes:
      - ${APP_DATA_DIR}/data/dash:/data/dash
      - ${APP_DATA_DIR}/data/pool:/data/pool:ro
    environment:
      SOLO45_DASH_DATA: /data/dash
      SOLO45_POOL_LOG: /data/pool/pool.log
      SOLO45_API_BASE: http://solo45-pool_pool_1:3380
      SOLO45_API_TOKEN: ${APP_SOLO45_POOL_API_TOKEN}
      SOLO45_PROXY_HOST: solo45-pool_app_proxy_1  # changes and live data only through the Umbrel login
      BITCOIN_ZMQ_HASHBLOCK: tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}  # new blocks, no log reading
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_POOL_DASHBOARD_IP}
