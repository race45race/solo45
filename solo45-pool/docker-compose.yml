version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solo45-pool_dashboard_1
      APP_PORT: 8099

  pool:
    image: ghcr.io/race45race/solo45:v0.1.9@sha256:db723ab7465fbb90c40bd8071787482f1a2d47d21b14cad001751d8a11b71eb7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 10s
    command: ["python", "/app/pool.py"]
    ports:
      - "3333:3333"  # stratum for miners
    volumes:
      - ${APP_DATA_DIR}/data/pool:/data/pool
    environment:
      SOLO45_DATA_DIR: /data/pool
      SOLO45_API_TOKEN: ${APP_SOLO45_POOL_API_TOKEN}
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_POOL_IP}  # fixed, so health checks on the Umbrel can read the pool's API

  dashboard:
    image: ghcr.io/race45race/solo45:v0.1.9@sha256:db723ab7465fbb90c40bd8071787482f1a2d47d21b14cad001751d8a11b71eb7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      - pool
    command: ["sh", "-c", "exec python /app/server.py >> /data/dash/dashboard.log 2>&1"]
    volumes:
      - ${APP_DATA_DIR}/data/dash:/data/dash
      - ${APP_DATA_DIR}/data/pool:/data/pool:ro
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro
    environment:
      SOLO45_DASH_DATA: /data/dash
      SOLO45_POOL_LOG: /data/pool/pool.log
      SOLO45_API_BASE: http://solo45-pool_pool_1:3380
      SOLO45_API_TOKEN: ${APP_SOLO45_POOL_API_TOKEN}
      SOLO45_PROXY_HOST: solo45-pool_app_proxy_1  # changes are only accepted through the Umbrel login
      BITCOIN_DATA_DIR: /bitcoin
      BITCOIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
    networks:
      default:
        ipv4_address: ${APP_SOLO45_POOL_DASHBOARD_IP}
