name: Solo45
version: "0.1.9"
tagline: Your own solo mining pool and live mining dashboard
icon: https://raw.githubusercontent.com/race45race/solo45/main/src/static/icon-512.png
description: >-
  ⚙️ **Setup:** open Solo45 after installing and enter your payout address. Then point your miners at your Umbrel's IP address on port 3333 (stratum+tcp://umbrel.local:3333). Any Stratum v1 miner works.


  Solo45 is a small solo-mining pool that builds work from your own Bitcoin node and pays any block you find straight to your address. Every new job is checked by your node (getblocktemplate "proposal" mode), so a malformed block would show up within seconds instead of on the day you find one.


  - **Template policy:** choose which transactions go into your blocks (inscriptions, Runes, large OP_RETURN data, bare multisig, low fee rates), with a watch-only mode to see what would be skipped first.

  - **Stall guard:** if a peer holds up a new block, Solo45 disconnects it after 60 seconds, so your miners don't spend 10 minutes on an old block.

  - **Live dashboard:** hashrate, temperatures, best shares, how fast your miners switch to each new block, electricity cost and your odds, for Bitaxe (AxeOS) and Braiins OS miners.

  - **Optional AI assistant** using your own Anthropic API key, with weekly and monthly spending limits.
releaseNotes: >-
  Fixed: settings changed on the dashboard (share difficulty, job update interval, stall guard, template policy, payout address, electricity price and AI settings) were refused since 0.1.5 on umbrelOS versions without a separate login proxy. The stall guard also stays quiet while the node is starting up.

