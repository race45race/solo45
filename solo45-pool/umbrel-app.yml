manifestVersion: 1
id: solo45-pool
category: bitcoin
name: Solo45
version: "0.1.32"
tagline: Your own solo mining pool and live mining dashboard
icon: https://raw.githubusercontent.com/race45race/solo45/main/src/static/icon-512.png
description: >-
  ⚙️ Setup: open Solo45 after installing and enter your payout address. Then point your miners at your Umbrel's IP address on port 3333, for example stratum+tcp://192.168.1.50:3333 (use the IP: many miners can't look up umbrel.local). Any Stratum v1 miner works. Keep port 3333 on your home network: don't forward it to the internet. Keep a backup pool set on every miner, so they keep hashing while Solo45 or your Umbrel restarts.


  Solo45 is a small solo-mining pool that builds work from your own Bitcoin node and pays any block you find straight to your address, with no pool fee. Every new job is checked by your node (getblocktemplate "proposal" mode), so a malformed block would show up within seconds instead of on the day you find one.


  • Template policy: choose which kinds of transactions to leave out of your blocks (inscriptions, Runes, large OP_RETURN data, bare multisig, low fee rates). Each rule can be Off, Watch (only count what it would skip) or Filter, and the fee rule treats child-pays-for-parent packages the way your node does.

  • Stall guard: if a peer holds up a new block, Solo45 disconnects it after 60 seconds (adjustable), so your miners don't spend 10 minutes on an old block.

  • Live dashboard: hashrate, temperatures, best shares, how fast your miners switch to each new block, electricity cost and your odds, for Bitaxe (AxeOS) and Braiins OS miners.

  • Optional AI assistant using your own Anthropic API key, with weekly and monthly spending limits.
releaseNotes: >-
  You can now choose how long miners stay on the empty block template after a new block (1 to 40 seconds, next to Empty block first in the dashboard settings). The miners now always get the empty template first, even when a routine template refresh spots the new block before the node's block signal does. Braiins OS miners' switch times are measured right when a block arrives, so they're no longer off by up to a second. Live shares and Best share today now sit side by side (stacked on phones).


developer: race45race
website: https://github.com/race45race/solo45
dependencies:
  - bitcoin
repo: https://github.com/race45race/solo45
support: https://github.com/race45race/solo45/issues

port: 4545
gallery:
  - https://raw.githubusercontent.com/race45race/solo45/main/docs/gallery/1.png
  - https://raw.githubusercontent.com/race45race/solo45/main/docs/gallery/2.png
  - https://raw.githubusercontent.com/race45race/solo45/main/docs/gallery/3.png
  - https://raw.githubusercontent.com/race45race/solo45/main/docs/gallery/4.png
path: ""

defaultUsername: ""
defaultPassword: ""

widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "dashboard:8099/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "230"
          subtext: "TH/s"
        - title: "Miners"
          text: "12/12"
          subtext: "online"
        - title: "Best today"
          text: "1.28"
          subtext: "G"
        - title: "Block odds"
          text: "1/29K"
          subtext: "per day"

backupIgnore:
  - data/pool/pool.log*
  - data/dash/dashboard.log*

submitter: race45race
submission: https://github.com/race45race/solo45
